[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ludo-game"
version = "0.1.0"
description = "GUI Ludo game with Tkinter and Pillow"
authors = [
{ name = "Mobin Yousefi", email = "[mobinyousefi.cs@gmail.com](mailto:mobinyousefi.cs@gmail.com)" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
"Pillow>=10.0.0",
]

[project.urls]
Homepage = "[https://github.com/mobinyousefi-cs/ludo-game](https://github.com/mobinyousefi-cs/ludo-game)"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
pythonpath = ["src"]
